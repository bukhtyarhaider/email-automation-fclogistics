      <!-- Desktop Application Titlebar -->
      <header class="app-titlebar">
        <div class="titlebar-left">
          <div class="window-dots">
            <span class="window-dot close"></span>
            <span class="window-dot minimize"></span>
            <span class="window-dot maximize"></span>
          </div>
          <a class="titlebar-brand" href="#dashboard">
            <span class="brand-monogram" id="brandMark">OD</span>
            <span id="brandName">OUTREACH DESK</span>
            <span class="brand-subtext">Desktop v1.0</span>
          </a>
        </div>

        <div class="titlebar-center">
          <div class="titlebar-campaign-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span id="workbookName">No workbook imported.</span>
          </div>
        </div>

        <div class="titlebar-right">
          <span class="dev-pill">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            Dev: Bukhtyar Haider
          </span>
          <span class="connection-pill" id="connection">
            <span class="connection-dot"></span>
            Mailbox disconnected
          </span>
        </div>
      </header>
