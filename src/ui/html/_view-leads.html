          <!-- ========================================== -->
          <!-- VIEW 2: LEADS WORKSPACE                    -->
          <!-- ========================================== -->
          <section class="view-page" id="view-leads">
            <div class="page-header">
              <div>
                <p class="page-eyebrow">DATA MANAGEMENT</p>
                <h1 class="page-title">Leads Workspace</h1>
                <p class="page-subtitle">Inspect contacts, verify eligibility, select targets, and preview personalized outreach.</p>
              </div>
              <div class="header-actions">
                <button id="reload" class="secondary">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                  Reload workbook
                </button>
                <label class="button secondary" for="upload" style="cursor: pointer;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                  Add .xlsx campaign
                </label>
                <input id="upload" type="file" accept=".xlsx" hidden />
                <a class="button secondary" href="/api/download" id="download">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                  Download updated workbook
                </a>
                <button id="deleteWorkspace" class="danger" title="Delete current leads workspace">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                  Delete workspace
                </button>
              </div>
            </div>

            <!-- Filter & Search Toolbar -->
            <div class="toolbar">
              <div class="toolbar-group">
                <div style="min-width: 170px;">
                  <select id="sheet" aria-label="Select worksheet">
                    <option value="">All worksheets</option>
                  </select>
                </div>
                <div style="min-width: 160px;">
                  <select id="filter" aria-label="Filter status">
                    <option value="ready">Ready for outreach</option>
                    <option value="all">All leads</option>
                    <option value="excluded">Excluded leads</option>
                  </select>
                </div>
                <div class="toolbar-search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  <input id="search" type="search" placeholder="Search company, contact, or email…" />
                </div>
              </div>

              <div class="toolbar-group">
                <button id="clearSelection" class="secondary" style="font-size: 11.5px;">Clear selection</button>
                <button id="deleteSelectedLeads" class="danger" style="font-size: 11.5px;" disabled>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                  Delete selected
                </button>
              </div>
            </div>

            <!-- Leads Data Grid -->
            <div class="table-container">
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th style="width: 44px; text-align: center;">
                        <input type="checkbox" id="selectPage" aria-label="Select eligible leads on this page" />
                      </th>
                      <th>Company / Principal</th>
                      <th>Contact Email</th>
                      <th>Location</th>
                      <th>Status / Reason</th>
                      <th style="width: 120px; text-align: right;">Action</th>
                    </tr>
                  </thead>
                  <tbody id="leadRows"></tbody>
                </table>
              </div>

              <div class="table-footer">
                <span id="pageInfo">Loading leads…</span>
                <div class="pagination-controls">
                  <button id="previous" class="secondary">Previous</button>
                  <button id="next" class="secondary">Next</button>
                </div>
              </div>
            </div>
          </section>
