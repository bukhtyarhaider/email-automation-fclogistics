          <section class="view-page" id="view-suppression">
            <div class="page-header">
              <div>
                <p class="page-eyebrow">COMPLIANCE & PROTECTION</p>
                <h1 class="page-title">Do Not Contact</h1>
                <p class="page-subtitle">Universal suppression list preventing accidental outreach to opt-outs, bounces, or competitors.</p>
              </div>
            </div>

            <div class="dashboard-grid">
              <!-- Add Suppression Card -->
              <div class="panel">
                <div class="panel-head">
                  <h2 class="panel-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
                    Add Suppressed Recipient
                  </h2>
                </div>

                <div class="form-group">
                  <label for="suppressEmail">Recipient Email Address</label>
                  <input id="suppressEmail" type="email" placeholder="e.g. carrier@example.com" />
                </div>

                <div class="form-group">
                  <label for="suppressReason">Reason for Suppression</label>
                  <input id="suppressReason" placeholder="e.g. Opt-out requested, permanent bounce, or competitor" />
                </div>

                <div class="form-actions">
                  <button id="suppress">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><plus></plus><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add to suppression list
                  </button>
                </div>
                <p class="hint">Suppression is durable across all imported workbooks and shared via the team coordinator.</p>
              </div>

              <!-- Suppressed Records List -->
              <div class="panel">
                <div class="panel-head">
                  <div style="display: flex; align-items: center; gap: 10px;">
                    <h2 class="panel-title">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                      Suppressed Records
                    </h2>
                    <span class="status-pill blocked" id="suppressionCountBadge">0 suppressed</span>
                  </div>
                  <div class="toolbar-search" style="min-width: 180px; max-width: 260px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input id="suppressionSearch" type="search" placeholder="Filter suppressed list…" />
                  </div>
                </div>
                <ul id="suppressionList"></ul>
              </div>
            </div>
          </section>
