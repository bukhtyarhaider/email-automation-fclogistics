name: Cross-platform tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:ui
      - run: npm test
        env:
          FC_BROWSER_TESTS: '1'
          FC_TEST_BROWSER_CHANNEL: chrome
      - run: node --test tests/browser-session.test.mjs
        if: runner.os == 'Windows'
        env:
          FC_BROWSER_TESTS: '1'
          FC_TEST_BROWSER_CHANNEL: msedge
